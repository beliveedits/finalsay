<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finalsay board</title>
<!--
  Finalsay: Board.html. One file, no libraries, nothing loaded from another site.
  Look: dark glass, soft glowing gradients (lime, pink, violet), rounded cards, a light strip on top.
  The approval rule is part of the look: a suggestion is dim and dashed until a person approves it.
  Every piece of lead data is put on the page with textContent, never as HTML, because names,
  subjects and AI text are untrusted.
  It uses the system font so the file stays small and loads nothing external.
  Opened outside Apps Script it shows made-up sample data, which is how the screenshots are made.
-->
<style>
:root {
  --night: #0A0B10; --panel: rgba(255, 255, 255, .055); --line: rgba(255, 255, 255, .11);
  --text: #F3F4F8; --muted: #A9AEBE;
  --day: #F2F3F6; --card: #FFFFFF; --ink: #13151E; --ink-muted: #5C6274; --day-line: #E2E4EA;
  --lime: #C9F65A; --lime-2: #7FE23C; --pink: #FF7FAE; --pink-2: #FFB08A; --violet: #8D9BFF; --violet-2: #5B4BFF;
  --amber: #FFB648; --focus: #FFFFFF;
  --glow-lime: linear-gradient(155deg, #E3FF8A 0%, #B6F04A 45%, #6FDB3A 100%);
  --glow-pink: linear-gradient(160deg, #FFC2D9 0%, #FF7FAE 48%, #FF9E7A 100%);
  --glow-violet: linear-gradient(155deg, #B9C2FF 0%, #8D9BFF 45%, #5B4BFF 100%);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; background: var(--night); }
body { margin: 0; min-height: 100vh; color: var(--text); background: var(--night); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
h1, h2, h3, p { margin: 0; }
button, select { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* the glow: three soft lights behind everything */
.aura { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
.aura i { position: absolute; border-radius: 50%; filter: blur(90px); opacity: .5; }
.aura .a { width: 520px; height: 520px; right: -140px; top: -120px; background: var(--pink); }
.aura .b { width: 560px; height: 560px; left: -200px; top: 420px; background: var(--lime-2); opacity: .34; }
.aura .c { width: 460px; height: 460px; right: 8%; bottom: -220px; background: var(--violet-2); opacity: .45; }
.app { position: relative; z-index: 1; max-width: 1240px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }

/* top bar */
.bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 4px 4px 0; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 1.15rem; letter-spacing: -.01em; }
.brand svg { width: 28px; height: 28px; }
.pills { display: flex; gap: 6px; margin-left: 8px; }
.pills a { color: var(--muted); text-decoration: none; padding: 7px 14px; border-radius: 999px; font-size: .93rem; }
.pills a:hover, .pills a:focus-visible { color: var(--text); background: var(--panel); }
.grow { flex: 1 1 auto; }
.btn { min-height: 42px; padding: 8px 18px; border-radius: 999px; border: 0; background: var(--glow-lime); color: #10150A; font-weight: 800; cursor: pointer; box-shadow: 0 6px 24px rgba(160, 240, 70, .32); }
.btn.quiet { background: var(--panel); color: var(--text); font-weight: 600; border: 1px solid var(--line); box-shadow: none; }
.btn.small { min-height: 38px; padding: 6px 14px; font-size: .93rem; }
.btn[disabled] { opacity: .55; cursor: progress; }
select { min-height: 40px; padding: 4px 12px; border-radius: 999px; border: 1px solid var(--line); background: #171923; color: var(--text); max-width: 100%; }
#status { min-height: 1.4em; padding: 0 6px; color: var(--muted); }
#status.bad { color: var(--amber); font-weight: 700; }

/* the light strip: today at a glance */
.day { --focus: #13151E; background: var(--day); color: var(--ink); border-radius: 28px; padding: 22px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(250px, 320px); gap: 18px; box-shadow: 0 30px 80px rgba(0, 0, 0, .45); }
.day h1 { font-size: clamp(1.7rem, 3.4vw, 2.5rem); font-weight: 800; letter-spacing: -.02em; line-height: 1.05; }
.day .stamp { color: var(--ink-muted); font-size: .9rem; margin-top: 4px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 18px; }
.tile { background: var(--card); border-radius: 20px; padding: 16px; min-height: 124px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 1px 0 var(--day-line), 0 12px 30px rgba(20, 22, 40, .07); min-width: 0; }
.tile .label { color: var(--ink-muted); font-size: .88rem; }
.tile .num { font-size: clamp(1.8rem, 3.2vw, 2.4rem); font-weight: 800; letter-spacing: -.02em; line-height: 1; font-variant-numeric: tabular-nums; overflow-wrap: anywhere; }
.bars { display: flex; align-items: flex-end; gap: 6px; height: 46px; }
.bars span { flex: 1 1 0; border-radius: 6px 6px 3px 3px; background: #D9DCE6; min-height: 4px; }
.bars span.on { background: var(--glow-violet); }
.spot { position: relative; border-radius: 24px; padding: 20px; background: var(--glow-pink); color: #2A0916; display: flex; flex-direction: column; gap: 8px; justify-content: flex-end; min-height: 230px; overflow: hidden; box-shadow: 0 18px 50px rgba(255, 110, 160, .45); }
.spot::before { content: ""; position: absolute; width: 190px; height: 190px; border-radius: 50%; right: -40px; top: -50px; background: rgba(255, 255, 255, .5); filter: blur(34px); }
.spot .label { font-size: .88rem; font-weight: 700; opacity: .8; position: relative; }
.spot .name { font-size: 1.55rem; font-weight: 800; letter-spacing: -.01em; line-height: 1.1; position: relative; overflow-wrap: anywhere; }
.spot .why { font-weight: 700; position: relative; }
.spot .next { position: relative; opacity: .85; overflow-wrap: anywhere; }

/* dark sections */
.sec { background: var(--panel); border: 1px solid var(--line); border-radius: 28px; padding: 20px; -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); }
.sec > h2 { font-size: 1.15rem; font-weight: 800; margin-bottom: 14px; display: flex; align-items: baseline; gap: 10px; }
.sec > h2 .count { color: var(--muted); font-weight: 600; font-size: .9rem; }

/* waiting for your say: dim and dashed until you decide */
#say-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(270px, 1fr)); }
#say-list li { position: relative; border: 1.5px dashed rgba(201, 246, 90, .55); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 8px; min-height: 170px; overflow: hidden; background: linear-gradient(180deg, rgba(201, 246, 90, .04) 0%, rgba(127, 226, 60, .2) 100%); }
#say-list li::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: -46px; height: 80px; border-radius: 50%; background: var(--lime-2); filter: blur(34px); opacity: .5; pointer-events: none; }
#say-list .who { font-weight: 800; position: relative; }
#say-list .what { position: relative; color: #E6E9F2; white-space: pre-wrap; overflow-wrap: anywhere; }
#say-list .acts { display: flex; gap: 8px; margin-top: auto; position: relative; z-index: 1; }
#say-list .none { border: 0; background: none; min-height: 0; padding: 0; color: var(--muted); }
#say-list .none::after { display: none; }

/* pipeline */
#board { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; align-items: start; }
.stage { background: rgba(10, 11, 16, .55); border: 1px solid var(--line); border-radius: 20px; min-width: 0; overflow: hidden; }
.stage > summary { list-style: none; cursor: default; padding: 12px 14px; display: flex; flex-wrap: wrap; align-items: center; gap: 2px 8px; font-weight: 800; border-bottom: 1px solid var(--line); }
.stage > summary::-webkit-details-marker { display: none; }
.stage .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--c, var(--muted)); box-shadow: 0 0 14px 3px var(--c, transparent); flex: none; }
.stage .count { margin-left: auto; color: var(--muted); font-weight: 600; font-size: .88rem; font-variant-numeric: tabular-nums; }
.stage[data-stage="New"] { --c: var(--violet); }
.stage[data-stage="Talking"] { --c: #5FD4FF; }
.stage[data-stage="Quote sent"] { --c: var(--pink); }
.stage[data-stage="Won"] { --c: var(--lime); }
.stage[data-stage="Lost"] { --c: #7C8192; }
.stage ul { list-style: none; margin: 0; padding: 8px; display: grid; gap: 8px; }
.card { padding: 12px; border-radius: 14px; background: rgba(255, 255, 255, .06); border: 1px solid rgba(255, 255, 255, .07); display: grid; gap: 4px; }
.card .name { font-weight: 700; overflow-wrap: anywhere; }
.card .co, .card .val { color: var(--muted); font-size: .88rem; }
.card .why { color: var(--amber); font-weight: 700; font-size: .9rem; }
.card .next { font-size: .93rem; overflow-wrap: anywhere; }
.card .move { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 6px; }
.card .move select { flex: 1 1 96px; min-width: 0; }
.empty { padding: 14px; color: var(--muted); font-size: .9rem; }

@media (max-width: 980px) {
  .day { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .spot { min-height: 180px; }
  #board { grid-template-columns: 1fr; }
  .stage > summary { cursor: pointer; }
  .stage > summary::after { content: "Show"; font-weight: 600; font-size: .88rem; color: var(--lime); text-decoration: underline; margin-left: 6px; }
  .stage[open] > summary::after { content: "Hide"; }
  .pills { display: none; }
}
@media (max-width: 480px) { .app { padding: 10px; gap: 12px; } .day, .sec { border-radius: 22px; padding: 14px; } .aura i { filter: blur(70px); } }
@media (prefers-reduced-motion: no-preference) { .btn, .pills a { transition: background-color .15s ease, color .15s ease, transform .15s ease; } .btn:active { transform: scale(.98); } }
</style>
</head>
<body>
<div class="aura" aria-hidden="true"><i class="a"></i><i class="b"></i><i class="c"></i></div>
<div class="app">
  <header class="bar">
    <span class="brand">
      <svg viewBox="0 0 64 64" aria-hidden="true"><g fill="#A9AEBE"><polygon points="8.75,8.75 19.75,8.75 19.75,13.75 13.75,13.75 13.75,19.75 8.75,19.75"/><rect x="24.25" y="8.75" width="9" height="5"/><polygon points="37.75,8.75 48.75,8.75 48.75,19.75 43.75,19.75 43.75,13.75 37.75,13.75"/><rect x="8.75" y="24.25" width="5" height="9"/><rect x="43.75" y="24.25" width="5" height="9"/><polygon points="8.75,37.75 13.75,37.75 13.75,43.75 19.75,43.75 19.75,48.75 8.75,48.75"/><rect x="24.25" y="43.75" width="9" height="5"/></g><rect x="37.25" y="37.25" width="18" height="18" fill="#C9F65A"/></svg>
      Finalsay
    </span>
    <nav class="pills" aria-label="Sections"><a href="#today">Today</a><a href="#say">Your say</a><a href="#pipeline">Pipeline</a></nav>
    <span class="grow"></span>
    <label class="sr" for="pipe">Pipeline filter</label>
    <select id="pipe" hidden></select>
    <button class="btn quiet small" id="refresh" type="button">Refresh</button>
  </header>
  <p id="status" role="status" aria-live="polite"></p>

  <section class="day" id="today" aria-labelledby="today-h">
    <div>
      <h1 id="today-h">Today</h1>
      <p class="stamp" id="stamp"></p>
      <div class="tiles">
        <div class="tile"><span class="label">Need you today</span><span class="num" id="n-need">0</span></div>
        <div class="tile"><span class="label">Waiting for your say</span><span class="num" id="n-say">0</span></div>
        <div class="tile"><span class="label">Open value</span><span class="num" id="n-value">0</span></div>
        <div class="tile"><span class="label">Leads by stage</span><div class="bars" id="bars" role="img" aria-label="Leads by stage"></div></div>
      </div>
    </div>
    <aside class="spot" aria-label="Who to answer first">
      <span class="label">Answer first</span>
      <span class="name" id="spot-name">Nobody</span>
      <span class="why" id="spot-why">Nobody needs you today.</span>
      <span class="next" id="spot-next"></span>
    </aside>
  </section>

  <section class="sec" id="say" aria-labelledby="say-h">
    <h2 id="say-h">Waiting for your say <span class="count" id="say-count"></span></h2>
    <ul id="say-list"></ul>
  </section>

  <section class="sec" id="pipeline" aria-labelledby="pipe-h">
    <h2 id="pipe-h">Pipeline</h2>
    <main id="board" aria-label="Leads by stage"></main>
  </section>
</div>

<script>
(function () {
  'use strict';
  var live = typeof google !== 'undefined' && google.script && google.script.run;
  var state = { data: null, pipeline: '' };
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined && text !== null) n.textContent = String(text);
    return n;
  }
  function say(msg, bad) { var s = $('status'); s.textContent = msg || ''; s.className = bad ? 'bad' : ''; }
  function busy(on) { Array.prototype.forEach.call(document.querySelectorAll('button, select'), function (b) { b.disabled = on; }); }
  function money(v) { var n = Number(String(v || '').replace(/[^0-9.]/g, '')); return isFinite(n) ? n : 0; }

  // ---- talking to the Sheet (or to made-up data when opened as a plain file) ----
  function call(name, args, done) {
    busy(true);
    if (!live) { window.setTimeout(function () { busy(false); done(demo[name].apply(null, args)); }, 120); return; }
    var run = google.script.run
      .withSuccessHandler(function (d) { busy(false); done(d); })
      .withFailureHandler(function (err) { busy(false); say('That did not work: ' + (err && err.message ? err.message : 'unknown error') + ' Nothing was changed.', true); });
    run[name].apply(run, args);
  }

  // ---- drawing ----
  function drawToday(d, mine) {
    var need = mine.filter(function (l) { return l.why; }).sort(function (a, b) { return (parseInt(b.priority, 10) || 0) - (parseInt(a.priority, 10) || 0); });
    $('n-need').textContent = need.length;
    $('n-say').textContent = (d.approvals || []).length;
    var open = mine.filter(function (l) { return l.stage !== 'Won' && l.stage !== 'Lost'; });
    var total = open.reduce(function (s, l) { return s + money(l.value); }, 0);
    $('n-value').textContent = total.toLocaleString('en');
    var counts = d.stages.map(function (s) { return mine.filter(function (l) { return l.stage === s; }).length; });
    var max = Math.max.apply(null, counts.concat([1])), bars = $('bars');
    bars.textContent = '';
    counts.forEach(function (c, i) {
      var b = el('span', c ? 'on' : '');
      b.style.height = Math.max(8, Math.round((c / max) * 100)) + '%';
      b.title = d.stages[i] + ': ' + c;
      bars.appendChild(b);
    });
    bars.setAttribute('aria-label', 'Leads by stage: ' + d.stages.map(function (s, i) { return s + ' ' + counts[i]; }).join(', '));
    var first = need[0];
    $('spot-name').textContent = first ? first.name : 'Nobody';
    $('spot-why').textContent = first ? first.why : 'Nobody needs you today.';
    $('spot-next').textContent = first && first.nextStep ? 'Next: ' + first.nextStep : '';
  }
  function drawSay(list) {
    var ul = $('say-list');
    ul.textContent = '';
    $('say-count').textContent = list.length ? list.length + (list.length === 1 ? ' suggestion' : ' suggestions') : '';
    if (!list.length) { ul.appendChild(el('li', 'none', 'Nothing is waiting. Suggestions from the AI appear here first.')); return; }
    list.forEach(function (a) {
      var li = el('li');
      li.appendChild(el('span', 'who', a.lead));
      li.appendChild(el('span', 'what', a.description));
      var acts = el('div', 'acts');
      var yes = el('button', 'btn small', 'Approve'); yes.type = 'button';
      yes.setAttribute('aria-label', 'Approve for ' + a.lead + ': ' + a.description);
      yes.addEventListener('click', function () { decide(a, 'Approve'); });
      var no = el('button', 'btn quiet small', 'Reject'); no.type = 'button';
      no.setAttribute('aria-label', 'Reject for ' + a.lead + ': ' + a.description);
      no.addEventListener('click', function () { decide(a, 'Reject'); });
      acts.appendChild(yes); acts.appendChild(no);
      li.appendChild(acts);
      ul.appendChild(li);
    });
  }
  function card(lead, stages) {
    var li = el('li', 'card');
    li.appendChild(el('span', 'name', lead.name || '(no name)'));
    if (lead.company) li.appendChild(el('span', 'co', lead.company));
    if (lead.why) li.appendChild(el('span', 'why', lead.why));
    if (lead.nextStep || lead.nextDate) li.appendChild(el('span', 'next', 'Next: ' + (lead.nextStep || 'no step set') + (lead.nextDate ? ' (' + lead.nextDate + ')' : '')));
    if (lead.value) li.appendChild(el('span', 'val', 'Value: ' + lead.value));
    var move = el('div', 'move');
    var id = 'mv-' + lead.id;
    var lab = el('label', 'sr', 'Move ' + lead.name + ' to stage'); lab.htmlFor = id;
    var sel = el('select'); sel.id = id;
    stages.forEach(function (s) { var o = el('option', '', s); o.value = s; if (s === lead.stage) o.selected = true; sel.appendChild(o); });
    var go = el('button', 'btn quiet small', 'Move'); go.type = 'button';
    go.addEventListener('click', function () {
      if (sel.value === lead.stage) { say(lead.name + ' is already in ' + lead.stage + '.'); return; }
      var to = sel.value;
      call('boardMove', [lead.id, to], function (d) { draw(d); say('Moved ' + lead.name + ' to ' + to + '.'); });
    });
    move.appendChild(lab); move.appendChild(sel); move.appendChild(go);
    li.appendChild(move);
    return li;
  }
  function draw(d) {
    state.data = d;
    $('stamp').textContent = d.generated ? 'As of ' + d.generated : '';
    var pipes = {};
    d.leads.forEach(function (l) { if (l.pipeline) pipes[l.pipeline] = true; });
    var names = Object.keys(pipes).sort(), pick = $('pipe');
    pick.hidden = names.length === 0;
    pick.textContent = '';
    if (names.length) {
      var all = el('option', '', 'All pipelines'); all.value = ''; pick.appendChild(all);
      names.forEach(function (n) { var o = el('option', '', n); o.value = n; if (n === state.pipeline) o.selected = true; pick.appendChild(o); });
    }
    var mine = d.leads.filter(function (l) { return !state.pipeline || l.pipeline === state.pipeline; });
    drawToday(d, mine);
    drawSay(d.approvals || []);
    var board = $('board'), wasOpen = {};
    Array.prototype.forEach.call(board.children, function (s) { wasOpen[s.getAttribute('data-stage')] = s.open; });
    board.textContent = '';
    d.stages.forEach(function (stage) {
      var here = mine.filter(function (l) { return l.stage === stage; });
      var sec = el('details', 'stage');
      sec.setAttribute('data-stage', stage);
      sec.open = wasOpen[stage] !== undefined ? wasOpen[stage] : true;
      var sum = el('summary');
      sum.appendChild(el('span', 'dot'));
      sum.appendChild(el('span', '', stage));
      sum.appendChild(el('span', 'count', here.length + (here.length === 1 ? ' lead' : ' leads')));
      sec.appendChild(sum);
      if (!here.length) sec.appendChild(el('p', 'empty', 'Nobody here.'));
      else { var ul = el('ul'); here.forEach(function (l) { ul.appendChild(card(l, d.stages)); }); sec.appendChild(ul); }
      board.appendChild(sec);
    });
  }
  function decide(a, decision) {
    call('boardDecide', [a.id, decision], function (d) {
      draw(d);
      var r = d.result || {};
      if (r.errors) say('That suggestion could not be applied. Open the Approvals tab to see why. Nothing was changed.', true);
      else say(decision === 'Approve' ? 'Applied for ' + a.lead + '.' : 'Rejected for ' + a.lead + '. Nothing was changed.');
    });
  }
  function load() { say('Loading…'); call('boardData', [], function (d) { draw(d); say(''); }); }

  $('refresh').addEventListener('click', load);
  $('pipe').addEventListener('change', function () { state.pipeline = this.value; if (state.data) draw(state.data); });

  // ---- made-up sample data, used only when this file is opened outside Apps Script ----
  var demo = (function () {
    var d = {
      stages: ['New', 'Talking', 'Quote sent', 'Won', 'Lost'], generated: 'sample data',
      leads: [
        { id: 'L-0001', name: 'Meera Joshi', company: 'Joshi Studio', stage: 'Talking', nextStep: 'Send the quote', nextDate: '2026-11-24', value: '48000', pipeline: '', why: 'Follow-up overdue by 2 days', priority: '102' },
        { id: 'L-0002', name: 'Tobias Lindqvist', company: 'Nordlys Apps', stage: 'New', nextStep: '', nextDate: '', value: '', pipeline: '', why: 'They wrote 2 days ago, you have not replied', priority: '82' },
        { id: 'L-0003', name: 'Aiko Tanabe', company: 'Tanabe Tea', stage: 'Quote sent', nextStep: '', nextDate: '', value: '22000', pipeline: '', why: 'Quote sent 6 days ago, no answer', priority: '76' },
        { id: 'L-0004', name: 'Carlos Mendes', company: 'Mendes Fit', stage: 'Talking', nextStep: 'Call about the script', nextDate: '2026-11-26', value: '', pipeline: '', why: 'Follow-up due today', priority: '90' },
        { id: 'L-0005', name: 'Farah Siddiqui', company: 'Lumen Clinic', stage: 'Won', nextStep: '', nextDate: '', value: '65000', pipeline: '', why: '', priority: '' },
        { id: 'L-0006', name: 'Daniel Okafor', company: 'Okafor Design', stage: 'New', nextStep: '', nextDate: '', value: '', pipeline: '', why: 'New lead with no contact logged', priority: '50' }
      ],
      approvals: [
        { id: 'P1', lead: 'Tobias Lindqvist', type: 'stage_change', description: 'Move stage to "Talking"', leadId: 'L-0002', stage: 'Talking' },
        { id: 'P2', lead: 'Meera Joshi', type: 'reply_draft', description: 'Save a reply as a Gmail DRAFT (never sent): Hi Meera, the quote is attached. Happy to walk you through it on a call this week.' },
        { id: 'P3', lead: 'Aiko Tanabe', type: 'next_step', description: 'Set next step: Check in about the quote (by 2026-11-28)', leadId: 'L-0003', nextStep: 'Check in about the quote', nextDate: '2026-11-28' }
      ]
    };
    var copy = function (extra) { var c = JSON.parse(JSON.stringify(d)); if (extra) c.result = extra; return c; };
    return {
      boardData: function () { return copy(); },
      boardMove: function (id, stage) { d.leads.forEach(function (l) { if (l.id === id) { l.stage = stage; l.why = ''; l.priority = ''; } }); return copy(); },
      boardDecide: function (id, decision) {
        var a = d.approvals.filter(function (x) { return x.id === id; })[0];
        d.approvals = d.approvals.filter(function (x) { return x.id !== id; });
        if (a && decision === 'Approve') d.leads.forEach(function (l) {
          if (l.id !== a.leadId) return;
          if (a.stage) l.stage = a.stage;
          if (a.nextStep) { l.nextStep = a.nextStep; l.nextDate = a.nextDate; }
        });
        return copy({ applied: decision === 'Approve' ? 1 : 0, rejected: decision === 'Reject' ? 1 : 0, errors: 0 });
      }
    };
  })();

  load();
})();
</script>
