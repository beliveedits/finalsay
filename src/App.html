<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finalsay</title>
<!--
  Finalsay: App.html. The phone app, for iPhone and Android browsers. One file, no libraries,
  nothing loaded from another site. It is a web page served from your own Google account, not a
  store app: open its address in Safari or Chrome and add it to the home screen.
  Lead data is put on the page with textContent only, because names and notes are untrusted.
  Opened outside Apps Script it shows made-up sample data.
-->
<style>
:root { color-scheme: dark; --night: #0A0B10; --panel: rgba(255,255,255,.06); --line: rgba(255,255,255,.12); --text: #F3F4F8; --muted: #A9AEBE;
  --lime: #C9F65A; --lime-2: #7FE23C; --pink: #FF7FAE; --violet: #8D9BFF; --violet-2: #5B4BFF; --amber: #FFB648;
  --glow-lime: linear-gradient(155deg, #E3FF8A 0%, #B6F04A 45%, #6FDB3A 100%);
  --glow-pink: linear-gradient(160deg, #FFC2D9 0%, #FF7FAE 48%, #FF9E7A 100%); }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { -webkit-text-size-adjust: 100%; background: var(--night); }
body { margin: 0; min-height: 100vh; color: var(--text); background: var(--night); font: 17px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow-x: hidden; }
h1, h2, p { margin: 0; }
button, select, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
[hidden] { display: none !important; }
.aura { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
.aura i { position: absolute; border-radius: 50%; filter: blur(80px); }
.aura .a { width: 340px; height: 340px; right: -140px; top: -120px; background: var(--pink); opacity: .5; }
.aura .b { width: 380px; height: 380px; left: -180px; bottom: 40px; background: var(--lime-2); opacity: .3; }
.app { position: relative; max-width: 520px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) 14px calc(96px + env(safe-area-inset-bottom)); }
header { display: flex; align-items: center; gap: 10px; padding: 4px 2px 12px; }
header h1 { font-size: 1.25rem; font-weight: 800; flex: 1; }
.btn { min-height: 46px; padding: 10px 18px; border-radius: 999px; border: 0; background: var(--glow-lime); color: #10150A; font-weight: 800; cursor: pointer; box-shadow: 0 6px 22px rgba(160,240,70,.3); text-decoration: none; display: inline-flex; align-items: center; justify-content: center; }
.btn.quiet { background: var(--panel); color: var(--text); border: 1px solid var(--line); box-shadow: none; font-weight: 600; }
.btn[disabled] { opacity: .55; }
#status { min-height: 1.4em; color: var(--muted); font-size: .95rem; padding: 0 2px 8px; }
#status.bad { color: var(--amber); font-weight: 700; }
h2 { font-size: 1.05rem; font-weight: 800; margin: 18px 2px 10px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tile { background: #F2F3F6; color: #13151E; border-radius: 20px; padding: 14px; }
.tile span { color: #5C6274; font-size: .88rem; display: block; }
.tile strong { font-size: 2rem; font-weight: 800; line-height: 1.1; }
.spot { margin-top: 10px; border-radius: 22px; padding: 18px; background: var(--glow-pink); color: #2A0916; box-shadow: 0 16px 44px rgba(255,110,160,.4); display: grid; gap: 4px; width: 100%; border: 0; text-align: left; cursor: pointer; }
.spot small { font-weight: 700; opacity: .8; font-size: .85rem; }
.spot b { font-size: 1.45rem; font-weight: 800; line-height: 1.1; overflow-wrap: anywhere; }
.spot em { font-style: normal; font-weight: 700; }
ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.row { width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: grid; gap: 3px; cursor: pointer; }
.row b { font-weight: 700; overflow-wrap: anywhere; }
.row .why { color: var(--amber); font-weight: 700; font-size: .93rem; }
.row .sub { color: var(--muted); font-size: .9rem; overflow-wrap: anywhere; }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 7px; background: var(--c, var(--muted)); box-shadow: 0 0 12px 2px var(--c, transparent); }
[data-stage="New"] { --c: var(--violet); } [data-stage="Talking"] { --c: #5FD4FF; } [data-stage="Quote sent"] { --c: var(--pink); } [data-stage="Won"] { --c: var(--lime); } [data-stage="Lost"] { --c: #7C8192; }
.prop { position: relative; overflow: hidden; border: 1.5px dashed rgba(201,246,90,.55); border-radius: 20px; padding: 14px; display: grid; gap: 8px; background: linear-gradient(180deg, rgba(201,246,90,.04), rgba(127,226,60,.2)); }
.prop b { font-weight: 800; } .prop span { white-space: pre-wrap; overflow-wrap: anywhere; color: #E6E9F2; }
.acts { display: flex; gap: 8px; flex-wrap: wrap; }
.empty { color: var(--muted); padding: 6px 2px; }
label { display: block; font-weight: 700; margin: 14px 2px 6px; font-size: .95rem; }
input, textarea, select { width: 100%; min-height: 48px; padding: 11px 14px; border-radius: 14px; border: 1px solid var(--line); background: #151722; font-size: 16px; }
textarea { min-height: 92px; resize: vertical; }
.chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 10px; }
.chip { flex: none; min-height: 38px; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.chip[aria-pressed="true"] { background: var(--glow-lime); color: #10150A; border-color: transparent; font-weight: 800; }
.facts { display: grid; gap: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 14px; margin-top: 10px; }
.facts div { overflow-wrap: anywhere; } .facts small { color: var(--muted); display: block; font-size: .82rem; }
.notes { white-space: pre-wrap; }
nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; padding: 8px 10px calc(8px + env(safe-area-inset-bottom)); background: rgba(12,13,19,.86); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); border-top: 1px solid var(--line); }
nav div { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
nav button { position: relative; min-height: 52px; border: 0; border-radius: 16px; background: none; color: var(--muted); font-weight: 600; font-size: .9rem; cursor: pointer; }
nav button[aria-current="page"] { background: var(--panel); color: var(--text); box-shadow: inset 0 -3px 0 var(--lime); }
nav .badge { position: absolute; top: -6px; right: 4px; min-width: 20px; padding: 0 6px; border-radius: 999px; background: var(--lime); color: #10150A; font-weight: 800; font-size: .78rem; line-height: 20px; }
</style>
</head>
<body>
<div class="aura" aria-hidden="true"><i class="a"></i><i class="b"></i></div>
<div class="app">
  <header><h1 id="title">Today</h1><button class="btn quiet" id="capture" type="button">Check email</button></header>
  <p id="status" role="status" aria-live="polite"></p>

  <main>
    <section id="v-today">
      <div class="tiles"><div class="tile"><span>Need you today</span><strong id="n-need">0</strong></div><div class="tile"><span>Waiting for your say</span><strong id="n-say">0</strong></div></div>
      <button class="spot" id="spot" type="button"><small>Answer first</small><b id="spot-name"></b><em id="spot-why"></em><span id="spot-next"></span></button>
      <h2>Who needs you</h2><ul id="today-list"></ul>
    </section>
    <section id="v-say" hidden><ul id="say-list"></ul></section>
    <section id="v-leads" hidden>
      <label for="q">Search</label><input id="q" type="search" autocomplete="off" placeholder="Name or company">
      <div class="chips" id="chips" role="group" aria-label="Stage"></div><ul id="lead-list"></ul>
    </section>
    <section id="v-lead" hidden>
      <button class="btn quiet" id="back" type="button">Back</button>
      <div class="facts" id="facts"></div>
      <div class="acts" id="contact" style="margin-top:10px"></div>
      <form id="edit">
        <label for="e-stage">Stage</label><select id="e-stage"></select>
        <label for="e-step">Next step</label><input id="e-step" type="text" maxlength="200" autocomplete="off">
        <label for="e-date">Next date</label><input id="e-date" type="date">
        <label for="e-note">Add a note</label><textarea id="e-note" maxlength="1000"></textarea>
        <div class="acts" style="margin-top:14px"><button class="btn" type="submit">Save</button><button class="btn quiet" id="suggest" type="button">Ask the AI for a next move</button></div>
      </form>
    </section>
    <section id="v-add" hidden>
      <form id="add">
        <label for="a-name">Name</label><input id="a-name" type="text" maxlength="120" autocomplete="off">
        <label for="a-email">Email</label><input id="a-email" type="email" maxlength="200" autocomplete="off" inputmode="email">
        <label for="a-phone">Phone</label><input id="a-phone" type="tel" maxlength="40" autocomplete="off">
        <label for="a-company">Company</label><input id="a-company" type="text" maxlength="120" autocomplete="off">
        <label for="a-wants">What they want</label><input id="a-wants" type="text" maxlength="300" autocomplete="off">
        <label for="a-step">Next step</label><input id="a-step" type="text" maxlength="200" autocomplete="off">
        <label for="a-date">Next date</label><input id="a-date" type="date">
        <div class="acts" style="margin-top:16px"><button class="btn" type="submit">Add lead</button></div>
      </form>
    </section>
  </main>
</div>
<nav aria-label="Finalsay"><div>
  <button type="button" data-v="today">Today</button><button type="button" data-v="say">Your say<span class="badge" id="badge" hidden></span></button>
  <button type="button" data-v="leads">Leads</button><button type="button" data-v="add">Add</button>
</div></nav>

<script>
(function () {
  'use strict';
  var live = typeof google !== 'undefined' && google.script && google.script.run;
  var S = { d: null, view: 'today', lead: null, stage: '', q: '' };
  var TITLES = { today: 'Today', say: 'Your say', leads: 'Leads', add: 'Add a lead', lead: 'Lead' };
  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text !== undefined && text !== null) n.textContent = String(text); return n; }
  function say(m, bad) { var s = $('status'); s.textContent = m || ''; s.className = bad ? 'bad' : ''; }
  function busy(on) { Array.prototype.forEach.call(document.querySelectorAll('button, select, input, textarea'), function (b) { b.disabled = on; }); }
  function call(name, args, done) {
    busy(true);
    if (!live) { window.setTimeout(function () { busy(false); try { done(demo[name].apply(null, args)); } catch (e) { say(e.message, true); } }, 120); return; }
    var run = google.script.run.withSuccessHandler(function (d) { busy(false); done(d); })
      .withFailureHandler(function (e) { busy(false); say((e && e.message ? e.message : 'That did not work.') + ' Nothing was changed.', true); });
    run[name].apply(run, args);
  }
  function show(view) {
    S.view = view;
    ['today', 'say', 'leads', 'lead', 'add'].forEach(function (v) { $('v-' + v).hidden = v !== view; });
    $('title').textContent = view === 'lead' && S.lead ? S.lead.name : TITLES[view];
    Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) {
      if (b.getAttribute('data-v') === (view === 'lead' ? 'leads' : view)) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');
    });
    window.scrollTo(0, 0);
  }
  function leadRow(l, withWhy) {
    var li = el('li'), b = el('button', 'row'); b.type = 'button'; b.setAttribute('data-stage', l.stage);
    var top = el('b'); top.appendChild(el('span', 'dot')); top.appendChild(document.createTextNode(l.name || '(no name)')); b.appendChild(top);
    if (withWhy && l.why) b.appendChild(el('span', 'why', l.why));
    b.appendChild(el('span', 'sub', [l.stage, l.company, l.nextStep ? 'Next: ' + l.nextStep : ''].filter(Boolean).join(' · ')));
    b.addEventListener('click', function () { openLead(l.id); });
    li.appendChild(b); return li;
  }
  function draw(d) {
    S.d = d;
    var need = d.leads.filter(function (l) { return l.why; }).sort(function (a, b) { return (parseInt(b.priority, 10) || 0) - (parseInt(a.priority, 10) || 0); });
    $('n-need').textContent = need.length; $('n-say').textContent = d.approvals.length;
    $('badge').hidden = !d.approvals.length; $('badge').textContent = d.approvals.length;
    var first = need[0];
    $('spot').hidden = !first;
    if (first) { $('spot-name').textContent = first.name; $('spot-why').textContent = first.why; $('spot-next').textContent = first.nextStep ? 'Next: ' + first.nextStep : ''; $('spot').onclick = function () { openLead(first.id); }; }
    var tl = $('today-list'); tl.textContent = '';
    if (!need.length) tl.appendChild(el('li', 'empty', 'Nobody needs you today.'));
    need.forEach(function (l) { tl.appendChild(leadRow(l, true)); });
    var sl = $('say-list'); sl.textContent = '';
    if (!d.approvals.length) sl.appendChild(el('li', 'empty', 'Nothing is waiting. Suggestions from the AI appear here first.'));
    d.approvals.forEach(function (a) {
      var li = el('li', 'prop'); li.appendChild(el('b', '', a.lead)); li.appendChild(el('span', '', a.description));
      var acts = el('div', 'acts');
      [['Approve', 'btn'], ['Reject', 'btn quiet']].forEach(function (x) {
        var b = el('button', x[1], x[0]); b.type = 'button'; b.setAttribute('aria-label', x[0] + ' for ' + a.lead + ': ' + a.description);
        b.addEventListener('click', function () {
          call('boardDecide', [a.id, x[0]], function (r) { draw(r); var res = r.result || {};
            say(res.errors ? 'That suggestion could not be applied. Nothing was changed.' : (x[0] === 'Approve' ? 'Applied for ' : 'Rejected for ') + a.lead + '.', !!res.errors); });
        });
        acts.appendChild(b);
      });
      li.appendChild(acts); sl.appendChild(li);
    });
    var chips = $('chips'); chips.textContent = '';
    [''].concat(d.stages).forEach(function (s) {
      var c = el('button', 'chip', s || 'All'); c.type = 'button'; c.setAttribute('aria-pressed', S.stage === s ? 'true' : 'false');
      c.addEventListener('click', function () { S.stage = s; draw(S.d); }); chips.appendChild(c);
    });
    var ll = $('lead-list'); ll.textContent = '';
    var q = S.q.toLowerCase();
    var list = d.leads.filter(function (l) { return (!S.stage || l.stage === S.stage) && (!q || (l.name + ' ' + l.company).toLowerCase().indexOf(q) >= 0); });
    if (!list.length) ll.appendChild(el('li', 'empty', 'No leads match.'));
    list.forEach(function (l) { ll.appendChild(leadRow(l, false)); });
    if (S.view === 'lead' && S.lead) openLead(S.lead.id, true);
  }
  function fact(box, label, value, cls) { if (!value) return; var d = el('div', cls || ''); d.appendChild(el('small', '', label)); d.appendChild(document.createTextNode(value)); box.appendChild(d); }
  function openLead(id, keep) {
    var l = S.d.leads.filter(function (x) { return x.id === id; })[0];
    if (!l) return show('leads');
    S.lead = l;
    var f = $('facts'); f.textContent = '';
    fact(f, 'Why today', l.why); fact(f, 'Company', l.company); fact(f, 'Email', l.email); fact(f, 'Phone', l.phone); fact(f, 'Wants', l.wants); fact(f, 'Budget', l.budget); fact(f, 'Deadline', l.deadline);
    fact(f, 'Value', l.value); fact(f, 'Last contact', l.lastContact ? l.lastContact + (l.lastDirection === 'in' ? ' (they wrote)' : l.lastDirection === 'out' ? ' (you wrote)' : '') : '');
    fact(f, 'Notes', l.notes, 'notes');
    if (!f.childNodes.length) f.appendChild(el('div', 'empty', 'No details yet.'));
    var c = $('contact'); c.textContent = '';
    var tel = String(l.phone || '').replace(/[^0-9+]/g, '');
    // Apps Script shows this page inside a frame, where a link only works with target _blank (or _top).
    if (tel.length >= 5) { var a = el('a', 'btn quiet', 'Call'); a.href = 'tel:' + tel; a.target = '_blank'; a.rel = 'noopener'; c.appendChild(a); }
    if (/^[^\s@<>",;]+@[^\s@<>",;]+\.[^\s@<>",;]+$/.test(l.email || '')) { var m = el('a', 'btn quiet', 'Email'); m.href = 'mailto:' + encodeURIComponent(l.email).replace('%40', '@'); m.target = '_blank'; m.rel = 'noopener'; c.appendChild(m); }
    var st = $('e-stage'); st.textContent = '';
    S.d.stages.forEach(function (s) { var o = el('option', '', s); o.value = s; if (s === l.stage) o.selected = true; st.appendChild(o); });
    if (!keep) { $('e-step').value = l.nextStep || ''; $('e-date').value = l.nextDate || ''; $('e-note').value = ''; }
    $('suggest').hidden = !S.d.aiOn;
    show('lead');
  }

  Array.prototype.forEach.call(document.querySelectorAll('nav button'), function (b) { b.addEventListener('click', function () { say(''); show(b.getAttribute('data-v')); }); });
  $('back').addEventListener('click', function () { show('leads'); });
  $('q').addEventListener('input', function () { S.q = this.value; draw(S.d); this.focus(); });
  $('capture').addEventListener('click', function () {
    say('Checking your labelled email…');
    call('appCapture', [], function (d) { draw(d); var r = d.capture || {};
      say(r.labelMissing ? 'The Gmail label was not found. Create it in Gmail and add it to a thread.' : (r.newLeads || 0) + ' new, ' + (r.updated || 0) + ' updated.', !!r.labelMissing); });
  });
  $('edit').addEventListener('submit', function (e) {
    e.preventDefault();
    var l = S.lead, ch = {};
    if ($('e-stage').value !== l.stage) ch.stage = $('e-stage').value;
    if ($('e-step').value !== (l.nextStep || '')) ch.nextStep = $('e-step').value;
    if ($('e-date').value !== (l.nextDate || '')) ch.nextDate = $('e-date').value;
    if ($('e-note').value.trim()) ch.note = $('e-note').value;
    if (!Object.keys(ch).length) { say('Nothing to save.'); return; }
    call('appUpdateLead', [l.id, ch], function (d) { S.view = 'lead'; draw(d); openLead(l.id); say('Saved.'); });
  });
  $('suggest').addEventListener('click', function () {
    var l = S.lead; say('Asking the AI…');
    call('appSuggest', [l.id], function (d) { draw(d); say(d.queued ? d.queued + ' suggestion(s) are waiting under Your say. Nothing has changed yet.' : 'The AI had nothing to suggest.'); });
  });
  $('add').addEventListener('submit', function (e) {
    e.preventDefault();
    var f = { name: $('a-name').value, email: $('a-email').value, phone: $('a-phone').value, company: $('a-company').value, wants: $('a-wants').value, nextStep: $('a-step').value, nextDate: $('a-date').value };
    call('appAddLead', [f], function (d) { e.target.reset(); S.q = ''; S.stage = ''; $('q').value = ''; draw(d); show('leads'); say('Lead added.'); });
  });

  // ---- made-up sample data, used only when this file is opened outside Apps Script ----
  var demo = (function () {
    var L = function (id, name, company, stage, why, priority, nextStep, nextDate, more) { var o = { id: id, name: name, company: company, stage: stage, why: why, priority: priority, nextStep: nextStep, nextDate: nextDate, value: '', email: '', phone: '', wants: '', budget: '', deadline: '', notes: '', lastContact: '', lastDirection: '', pipeline: '' }; for (var k in more) o[k] = more[k]; return o; };
    var d = { stages: ['New', 'Talking', 'Quote sent', 'Won', 'Lost'], aiOn: true, leads: [
      L('L-0001', 'Meera Joshi', 'Joshi Studio', 'Talking', 'Follow-up overdue by 2 days', '102', 'Send the quote', '2026-11-24', { value: '48000', email: 'meera@joshi-studio.example', phone: '+1 415 555 0132', wants: '30 second launch film', budget: 'around 50,000', deadline: 'mid December', lastContact: '2026-11-25', lastDirection: 'out', notes: '2026-11-20: Met at the design meetup' }),
      L('L-0004', 'Carlos Mendes', 'Mendes Fit', 'Talking', 'Follow-up due today', '90', 'Call about the script', '2026-11-26', { email: 'carlos@mendes-fit.example' }),
      L('L-0002', 'Tobias Lindqvist', 'Nordlys Apps', 'New', 'They wrote 2 days ago, you have not replied', '82', '', '', { email: 'tobias@nordlys-apps.example', wants: 'App store preview video' }),
      L('L-0003', 'Aiko Tanabe', 'Tanabe Tea', 'Quote sent', 'Quote sent 6 days ago, no answer', '76', '', '', { value: '22000', email: 'aiko@tanabe-tea.example' }),
      L('L-0005', 'Farah Siddiqui', 'Lumen Clinic', 'Won', '', '', '', '', { value: '65000' }),
      L('L-0006', 'Daniel Okafor', 'Okafor Design', 'New', 'New lead with no contact logged', '50', '', '', {})
    ], approvals: [
      { id: 'P1', lead: 'Tobias Lindqvist', description: 'Move stage to "Talking"', leadId: 'L-0002', stage: 'Talking' },
      { id: 'P2', lead: 'Meera Joshi', description: 'Save a reply as a Gmail DRAFT (never sent): Hi Meera, the quote is attached. Happy to walk you through it on a call this week.' }
    ] };
    var copy = function (x) { var c = JSON.parse(JSON.stringify(d)); for (var k in x) c[k] = x[k]; return c; };
    return {
      appData: function () { return copy(); },
      appCapture: function () { return copy({ capture: { newLeads: 0, updated: 0 } }); },
      appSuggest: function () { return copy({ queued: 0 }); },
      appAddLead: function (f) { if (!f.name && !f.email) throw new Error('Type a name or an email.'); d.leads.push(L('L-00' + (10 + d.leads.length), f.name, f.company, 'New', 'New lead with no contact logged', '50', f.nextStep, f.nextDate, { email: f.email, phone: f.phone, wants: f.wants })); return copy(); },
      appUpdateLead: function (id, ch) { d.leads.forEach(function (l) { if (l.id !== id) return; if (ch.stage) l.stage = ch.stage; if (ch.nextStep !== undefined) l.nextStep = ch.nextStep; if (ch.nextDate !== undefined) l.nextDate = ch.nextDate; if (ch.note) l.notes = (l.notes ? l.notes + '\n' : '') + 'today: ' + ch.note; }); return copy(); },
      boardDecide: function (id, decision) { var a = d.approvals.filter(function (x) { return x.id === id; })[0]; d.approvals = d.approvals.filter(function (x) { return x.id !== id; });
        if (a && decision === 'Approve' && a.stage) d.leads.forEach(function (l) { if (l.id === a.leadId) l.stage = a.stage; });
        return copy({ result: { applied: decision === 'Approve' ? 1 : 0, rejected: decision === 'Reject' ? 1 : 0, errors: 0 } }); }
    };
  })();

  say('Loading…');
  call('appData', [], function (d) { draw(d); show('today'); say(''); });
})();
</script>
</body>
</html>
